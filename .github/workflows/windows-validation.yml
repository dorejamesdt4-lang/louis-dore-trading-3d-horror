name: Windows game validation

on:
  push:
    branches: ["windows-v0.3-room-expansion"]
  pull_request:
    branches: ["main"]

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy Pillow
      - name: Run engine-independent tests
        run: python -m unittest discover -s tests -v

  source-package:
    runs-on: ubuntu-latest
    needs: logic-tests
    steps:
      - uses: actions/checkout@v4
      - name: Create source ZIP
        run: zip -r the-shifting-mansion-windows-v0.3.zip . -x ".git/*" ".github/*" "assets/generated/*" "__pycache__/*" "game/__pycache__/*" "tests/__pycache__/*"
      - uses: actions/upload-artifact@v4
        with:
          name: the-shifting-mansion-windows-v0.3
          path: the-shifting-mansion-windows-v0.3.zip
